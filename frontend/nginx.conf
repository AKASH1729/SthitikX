upstream backend {
    server backend:5000;
}

server {
    listen 80;
    server_name mahadevassociates.online www.mahadevassociates.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mahadevassociates.online www.mahadevassociates.online;

    ssl_certificate /etc/letsencrypt/live/mahadevassociates.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mahadevassociates.online/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
