upstream backend {
    server geotrack-api:5000;
}

server {
    listen 80;
    server_name sthitix.online www.sthitix.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sthitix.online www.sthitix.online;

    ssl_certificate /etc/letsencrypt/live/sthitix.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sthitix.online/privkey.pem;

    client_max_body_size 5M;
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    # 🔥 FIXED (DO NOT REMOVE /api)
    location /api/ {
        proxy_pass http://backend;   # ❗ NO trailing slash
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
