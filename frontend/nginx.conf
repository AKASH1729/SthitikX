upstream backend {
    server geotrack-api:5000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name sthitix.online www.sthitix.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sthitix.online www.sthitix.online;

    ssl_certificate /etc/letsencrypt/live/sthitix.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sthitix.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20M;

    # ===============================
    # SECURITY
    # ===============================

    # Block hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block sensitive file extensions
    location ~* \.(env|git|bak|backup|old|save|sql|log|ini|yaml|yml|conf)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Disable directory listing
    autoindex off;

    # ===============================
    # FRONTEND
    # ===============================

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ===============================
    # BACKEND API
    # ===============================

    location /api/ {
        proxy_pass http://backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    # ===============================
    # SOCKET.IO
    # ===============================

    location /socket.io/ {
        proxy_pass http://backend;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    # ===============================
    # GZIP
    # ===============================

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        text/xml
        image/svg+xml;
}
