version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: geotrack-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - geotrack-network
    command: sh -c "npm start"

  frontend:
    build:
      context: ./frontend
    container_name: geotrack-frontend
    restart: unless-stopped
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./frontend/.env
    networks:
      - geotrack-network
    depends_on:
      - backend

networks:
  geotrack-network:
    driver: bridge
